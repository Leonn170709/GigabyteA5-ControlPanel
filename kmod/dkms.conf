PACKAGE_NAME="a5ctl"
PACKAGE_VERSION="0.1"
BUILT_MODULE_NAME[0]="a5ctl"
DEST_MODULE_LOCATION[0]="/extra"
# Delegate to our own Makefile, which detects whether the *target* kernel is clang- or
# gcc-built (kernel_source_dir is the kernel being built for, not necessarily the running one).
MAKE[0]="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KDIR=${kernel_source_dir}"
CLEAN="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
# NOTE: DKMS rebuilds the module on kernel updates; it does NOT auto-LOAD it.
# Loading stays manual (labctl modload) so fan control is never engaged unattended.
